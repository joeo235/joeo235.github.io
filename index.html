<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joe Olivier</title>
<meta name="description" content="Joe Olivier — Learning Experience Designer.">
<link rel="canonical" href="https://joeo235.github.io/">
<meta property="og:type" content="profile">
<meta property="og:title" content="Joe Olivier">
<meta property="og:description" content="Learning Experience Designer.">
<meta property="og:url" content="https://joeo235.github.io/">
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfbf9;
    --fg: #1a1a18;
    --muted: #6b6b63;
    --rule: #e2e2dc;
    --link: #3a5a40;
    --skyline: #3a5a40;
    --skyline-opacity: 0.22;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14141a;
      --fg: #ecece8;
      --muted: #9a9a92;
      --rule: #2c2c34;
      --link: #a8c3a0;
      --skyline: #a8c3a0;
      --skyline-opacity: 0.20;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
                 "Helvetica Neue", Arial, sans-serif;
    font-size: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
    line-height: 1.6;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
  }

  main {
    width: 100%;
    max-width: 34rem;
  }

  h1 {
    margin: 0;
    font-size: clamp(2rem, 1.5rem + 2.2vw, 3rem);
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }

  .bio {
    margin: 1rem 0 0;
    color: var(--muted);
    text-wrap: pretty;
  }

  nav {
    margin-top: 2rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--rule);
  }

  a {
    color: var(--link);
    text-decoration-thickness: 1px;
    text-underline-offset: 0.25em;
    border-radius: 2px;
  }

  a:hover { text-decoration-thickness: 2px; }

  a:focus-visible {
    outline: 2px solid var(--link);
    outline-offset: 3px;
    text-decoration: none;
  }

  /* Decorative Chicago skyline, anchored to the bottom of the viewport. */
  .skyline {
    position: fixed;
    left: 0;
    bottom: 0;
    width: 100%;
    overflow: hidden;
    line-height: 0;
    z-index: -1;
    color: var(--skyline);
    opacity: var(--skyline-opacity);
    pointer-events: none;
  }

  .skyline svg {
    display: block;
    width: 100%;
    height: auto;
  }

  /* Below this width, shrinking the whole skyline to fit makes the towers
     unreadably small, so hold a minimum width and let the wrapper crop the
     ends instead, keeping the tall cluster centered. */
  @media (max-width: 760px) {
    .skyline svg {
      width: 760px;
      position: relative;
      left: 50%;
      transform: translateX(-50%);
    }
  }

  /* On a short viewport the skyline would crowd the text. */
  @media (max-height: 430px) {
    .skyline { display: none; }
  }

</style>
</head>
<body>
  <main>
    <h1>Joe Olivier</h1>
    <p class="bio">Learning Experience Designer</p>
    <nav>
      <a rel="me" href="https://www.linkedin.com/in/joeolivier/">LinkedIn</a>
    </nav>
  </main>

    <g fill="currentColor">
      <rect x="0" y="172" width="58" height="48"/>
      <rect x="54" y="152" width="40" height="68"/>

      <!-- Marina City -->
      <rect x="100" y="124" width="44" height="96"/>
      <ellipse cx="122" cy="124" rx="22" ry="9"/>
      <rect x="152" y="124" width="44" height="96"/>
      <ellipse cx="174" cy="124" rx="22" ry="9"/>

      <rect x="204" y="144" width="42" height="76"/>
      <rect x="250" y="164" width="28" height="56"/>

      <!-- Trump Tower -->

      <rect x="296" y="88" width="42" height="36"/>

      <!-- Willis Tower -->

      <rect x="586" y="6" width="3" height="28"/>
      <rect x="601" y="6" width="3" height="28"/>

      <rect x="652" y="142" width="34" height="78"/>

      <!-- 311 South Wacker -->
      <rect x="692" y="104" width="46" height="116"/>
      <ellipse cx="715" cy="104" rx="23" ry="11"/>

      <rect x="746" y="152" width="38" height="68"/>
      <rect x="790" y="170" width="26" height="50"/>

      <!-- John Hancock Center -->
      <polygon points="836,220 884,220 872,62 848,62"/>
      <rect x="852" y="12" width="3" height="50"/>
      <rect x="866" y="12" width="3" height="50"/>

      <rect x="894" y="146" width="40" height="74"/>

  </svg>
  </div>
</body>
</html>
