<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joe Olivier</title>
<meta name="description" content="Joe Olivier — personal homepage.">
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfbf9;
    --fg: #1a1a18;
    --muted: #6b6b63;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14141a;
      --fg: #ecece8;
      --muted: #9a9a92;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
                 "Helvetica Neue", Arial, sans-serif;
    font-size: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
    line-height: 1.6;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
  }

  main {
    width: 100%;
    max-width: 34rem;
  }

  h1 {
    margin: 0;
    font-size: clamp(2rem, 1.5rem + 2.2vw, 3rem);
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }

  .bio {
    margin: 1rem 0 0;
    color: var(--muted);
    text-wrap: pretty;
  }

</style>
</head>
<body>
  <main>
    <h1>Joe Olivier</h1>
    <p class="bio">This page is being rebuilt.</p>
  </main>
</body>
</html>
